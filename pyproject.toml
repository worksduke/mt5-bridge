# ============================================================================
# mt5-bridge - Project Configuration
# ============================================================================
# Layout:     src layout (src/mt5_bridge/)
# Python:     3.12+
# License:    MIT
# ============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ----------------------------------------------------------------------------
# [project] - PEP 621 standard metadata
# ----------------------------------------------------------------------------
[project]
name = "mt5-bridge"
description = "Pykka + msgspec event bridge for MetaTrader 5"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Tonny.Bao", email = "254372664@qq.com" },
]

# Version is read dynamically from src/mt5_bridge/__init__.py::__version__
# (single source of truth).
dynamic = ["version"]

# ---- Runtime dependencies ----
# MetaTrader5 wheels are Windows-only; the marker keeps `pip install`
# from failing on non-Windows machines that only want to read message
# definitions or run the dispatcher in tests.
dependencies = [
    "MetaTrader5>=5.0; sys_platform == 'win32'",
    "pykka>=4.0",
    "msgspec>=0.21",
    "structlog>=25.0",
    # structlog's ConsoleRenderer needs colorama on Windows for ANSI colors.
    "colorama>=0.4.6; sys_platform == 'win32'",
]

# ---- Optional dependency groups ----
# Install via:  pip install -e .[rpc]    (built-in Twisted EA receiver)
# Install via:  pip install -e .[dev]    (pulls in [rpc] + pytest)
[project.optional-dependencies]
rpc = [
    "twisted>=24.0",
]
dev = [
    "mt5-bridge[rpc]",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    "mypy>=1.18",
]

# Console scripts. After `pip install -e .`, `mt5-bridge` is on PATH.
[project.scripts]
mt5-bridge = "mt5_bridge.__main__:main"

# ----------------------------------------------------------------------------
# [tool.setuptools] - src layout configuration
# ----------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
# Whitelist prevents tests/ or any sibling dir from being packaged.
include = ["mt5_bridge*"]

[tool.setuptools.dynamic]
# Read __version__ from mt5_bridge/__init__.py at build time.
version = { attr = "mt5_bridge.__version__" }

# ----------------------------------------------------------------------------
# [tool.pytest.ini_options] - pytest configuration
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

# ----------------------------------------------------------------------------
# [tool.ruff] - linter + formatter
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Starter selection: pycodestyle errors+warnings, pyflakes, isort.
# Future: add UP (pyupgrade), B (bugbear), SIM (simplify) when ready.
select = ["E", "W", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests can have long lines (multi-line msgspec.Struct constructors etc.)
"tests/*" = ["E501"]
# Two src files have intentional long lines for readability:
#   - executor.py: aligned _STATE_TABLE dict (one row per command type)
#   - trade_commands.py: error messages enumerating MT5 constants
"src/mt5_bridge/actors/executor.py" = ["E501"]
"src/mt5_bridge/contracts/trade_commands.py" = ["E501"]

# ----------------------------------------------------------------------------
# [tool.mypy] - type checker
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# MetaTrader5 / pykka / twisted have no public type stubs.
ignore_missing_imports = true
